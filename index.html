<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a0a0a">
<title>JONY MAIL</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  --bg:#0d0d0d;
  --panel:#141414;
  --panel-2:#1a1a1a;
  --line:#262626;
  --ink:#f0f0f0;
  --ink-dim:#8a8a8a;
  --ink-faint:#4a4a4a;
  --accent:#d4ff00;
  --danger:#ff4545;
  --mono:"JetBrains Mono","SF Mono",Menlo,Consolas,monospace;
  --sans:"Inter","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--sans);
  font-size:14px;
  -webkit-font-smoothing:antialiased;
}

.app{
  display:grid;
  grid-template-columns:280px 1fr;
  height:100vh;
  overflow:hidden;
}

/* ============ SIDEBAR ============ */
.side{
  background:var(--panel);
  border-right:1px solid var(--line);
  display:flex;flex-direction:column;
  height:100vh;
  overflow:hidden;
}

.side-head{
  padding:20px 18px 16px;
  border-bottom:1px solid var(--line);
}
.brand{
  font-family:var(--mono);
  font-size:16px;
  font-weight:800;
  letter-spacing:1px;
  color:var(--ink);
  display:flex;align-items:center;gap:8px;
}
.brand::before{
  content:"";
  width:8px;height:8px;
  background:var(--accent);
  display:inline-block;
}

.side-scroll{
  flex:1;
  overflow-y:auto;
  padding:12px 10px;
}

.group-label{
  font-family:var(--mono);
  font-size:10px;
  color:var(--ink-faint);
  text-transform:uppercase;
  letter-spacing:1.5px;
  padding:12px 10px 6px;
}

.folder{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 12px;
  cursor:pointer;
  border-radius:6px;
  color:var(--ink-dim);
  font-size:13px;
  transition:all .12s;
  position:relative;
}
.folder:hover{background:var(--panel-2);color:var(--ink)}
.folder.active{background:var(--panel-2);color:var(--ink)}
.folder.active::before{
  content:"";
  position:absolute;left:0;top:8px;bottom:8px;
  width:2px;background:var(--accent);
}
.folder-icon{
  font-size:14px;
  flex-shrink:0;
  width:16px;text-align:center;
}
.folder-name{
  flex:1;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.folder-count{
  font-family:var(--mono);
  font-size:10px;
  color:var(--ink-faint);
  background:var(--bg);
  padding:2px 6px;
  border-radius:3px;
  min-width:20px;text-align:center;
}
.folder.active .folder-count{color:var(--accent)}

/* account items */
.account-item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 12px;
  border-radius:6px;
  cursor:pointer;
  color:var(--ink-dim);
  font-size:12px;
  transition:all .12s;
  position:relative;
}
.account-item:hover{background:var(--panel-2);color:var(--ink)}
.account-item.active{background:var(--panel-2);color:var(--ink)}
.account-item.active::before{
  content:"";
  position:absolute;left:0;top:8px;bottom:8px;
  width:2px;background:var(--accent);
}
.acc-dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--accent);
  flex-shrink:0;
}
.acc-email{
  flex:1;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-family:var(--mono);
  font-size:11px;
}
.acc-remove{
  opacity:0;
  background:none;border:0;color:var(--danger);
  cursor:pointer;font-size:14px;
  padding:0 4px;
  transition:opacity .12s;
  line-height:1;
}
.account-item:hover .acc-remove{opacity:1}

.side-foot{
  padding:12px;
  border-top:1px solid var(--line);
}

/* buttons */
button{
  font-family:var(--mono);
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:1px;
  padding:10px 14px;
  border-radius:6px;
  border:1px solid var(--line);
  background:transparent;
  color:var(--ink-dim);
  cursor:pointer;
  transition:all .15s;
  font-weight:600;
}
button:hover{border-color:var(--accent);color:var(--accent)}
button.primary{
  background:var(--accent);
  border-color:var(--accent);
  color:#0a0a0a;
  width:100%;
}
button.primary:hover{background:var(--ink);border-color:var(--ink);color:var(--bg)}
button.sm{padding:6px 10px;font-size:10px}

/* ============ MAIN ============ */
.main{
  display:flex;flex-direction:column;
  overflow:hidden;
  background:var(--bg);
}

.topbar{
  padding:16px 24px;
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px;
  flex-wrap:wrap;
  background:var(--panel);
}
.topbar h1{
  font-size:18px;
  font-weight:700;
  letter-spacing:-0.3px;
  flex:1;
  min-width:100px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.topbar h1 small{
  font-family:var(--mono);
  font-size:11px;
  color:var(--ink-faint);
  text-transform:uppercase;
  letter-spacing:1.5px;
  margin-left:8px;
  font-weight:400;
}

.search{
  background:var(--panel-2);
  border:1px solid var(--line);
  border-radius:6px;
  padding:9px 14px;
  color:var(--ink);
  font-family:var(--mono);
  font-size:12px;
  outline:none;
  width:260px;
  transition:border-color .15s;
}
.search:focus{border-color:var(--accent)}
.search::placeholder{color:var(--ink-faint)}

.mail-scroll{
  flex:1;
  overflow-y:auto;
}

#status{
  padding:8px 24px;
  font-family:var(--mono);
  font-size:11px;
  color:var(--ink-faint);
  border-bottom:1px solid var(--line);
  background:var(--panel);
}

/* MAIL ROW */
.mail{
  padding:16px 24px;
  border-bottom:1px solid var(--line);
  cursor:pointer;
  display:grid;
  grid-template-columns:200px 1fr auto;
  gap:6px 20px;
  align-items:center;
  transition:background .12s;
}
.mail:hover{background:var(--panel)}
.mail-from{
  font-family:var(--mono);
  font-size:11px;
  color:var(--ink-dim);
  text-transform:uppercase;
  letter-spacing:0.8px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.mail-subject{
  font-size:14px;
  font-weight:600;
  color:var(--ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.mail-date{
  font-family:var(--mono);
  font-size:10px;
  color:var(--ink-faint);
  white-space:nowrap;
}
.mail-snippet{
  grid-column:1 / -1;
  font-size:12px;
  color:var(--ink-dim);
  overflow:hidden;
  display:-webkit-box;
  -webkit-line-clamp:1;
  -webkit-box-orient:vertical;
  padding-left:0;
}
.mail-account-tag{
  font-family:var(--mono);
  font-size:9px;
  color:var(--accent);
  background:#d4ff0015;
  padding:2px 6px;
  border-radius:3px;
  letter-spacing:0.5px;
  white-space:nowrap;
}

/* ============ READER ============ */
.reader{
  display:none;
  flex-direction:column;
  height:100%;
  overflow:hidden;
}
.reader.show{display:flex}
.reader-head{
  padding:16px 24px;
  border-bottom:1px solid var(--line);
  background:var(--panel);
  display:flex;align-items:center;gap:12px;
}
.reader-body{
  flex:1;
  overflow-y:auto;
  padding:32px 40px;
}
.reader-body h2{
  font-size:24px;
  font-weight:700;
  letter-spacing:-0.5px;
  line-height:1.3;
  margin-bottom:16px;
}
.reader-info{
  display:flex;flex-direction:column;gap:4px;
  font-family:var(--mono);
  font-size:11px;
  color:var(--ink-dim);
  padding:14px 0 20px;
  border-bottom:1px solid var(--line);
  margin-bottom:24px;
  text-transform:uppercase;
  letter-spacing:0.8px;
}
.reader-info strong{
  color:var(--accent);
  font-weight:400;
  display:inline-block;
  width:70px;
}
.reader-content{
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  font-size:15px;
  line-height:1.7;
  color:var(--ink);
}

/* empty */
.empty{
  padding:60px 30px;
  text-align:center;
  font-family:var(--mono);
  font-size:11px;
  color:var(--ink-faint);
  text-transform:uppercase;
  letter-spacing:2px;
}

/* scrollbar */
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--ink-faint)}

/* mobile */
@media(max-width:760px){
  .app{grid-template-columns:1fr;height:auto;min-height:100vh}
  .side{
    height:auto;
    max-height:50vh;
    border-right:0;border-bottom:1px solid var(--line);
  }
  .main{height:auto;min-height:50vh}
  .mail{grid-template-columns:1fr auto;gap:4px 12px;padding:14px 18px}
  .mail-from{grid-column:1/-1}
  .mail-subject{grid-column:1}
  .mail-date{grid-column:2;text-align:right}
  .search{width:100%;order:10;margin-top:4px}
  .topbar{padding:14px 18px}
  .reader-body{padding:20px}
  .reader-body h2{font-size:20px}
}
</style>
</head>
<body>

<div class="app">

  <!-- SIDEBAR -->
  <aside class="side">
    <div class="side-head">
      <div class="brand">JONY MAIL</div>
    </div>

    <div class="side-scroll">
      <!-- FOLDER: ALL INBOX -->
      <div class="group-label">Folders</div>
      <div class="folder active" id="folder-all" onclick="selectAll()">
        <span class="folder-icon">🗂</span>
        <span class="folder-name">All Inbox</span>
        <span class="folder-count" id="count-all">0</span>
      </div>

      <!-- GMAIL ACCOUNTS LIST -->
      <div class="group-label">Gmail Accounts</div>
      <div id="accountsList">
        <div class="empty" style="padding:16px 12px;font-size:10px;text-align:left">no accounts yet</div>
      </div>
    </div>

    <div class="side-foot">
      <button class="primary" onclick="connectGmail()">+ Connect Gmail</button>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main">

    <!-- LIST VIEW -->
    <div id="listView" style="display:flex;flex-direction:column;height:100%;overflow:hidden">
      <div class="topbar">
        <h1 id="viewTitle">All Inbox <small id="viewCount">0 messages</small></h1>
        <input class="search" id="search" placeholder="search..." oninput="renderMails()">
        <button class="sm" onclick="loadAll()">↻ Refresh</button>
      </div>
      <div id="status">connect a gmail to begin</div>
      <div class="mail-scroll" id="mailList">
        <div class="empty">no messages</div>
      </div>
    </div>

    <!-- READER VIEW -->
    <div class="reader" id="reader">
      <div class="reader-head">
        <button class="sm" onclick="closeReader()">← Back</button>
      </div>
      <div class="reader-body">
        <h2 id="readSubject"></h2>
        <div class="reader-info" id="readInfo"></div>
        <div class="reader-content" id="readBody"></div>
      </div>
    </div>

  </main>

</div>

<script>
const CLIENT_ID = "370585861930-2mgn160ebad39s3des7js84o4ke1nkgf.apps.googleusercontent.com";
const SCOPES = "https://www.googleapis.com/auth/gmail.modify https://www.googleapis.com/auth/gmail.send";

let accounts = [];       // [{email, token}]
let mails = [];          // [{id, accountIndex, email, from, subject, date, snippet}]
let currentView = "all"; // "all" or account index

function status(t){ document.getElementById("status").textContent = t; }

/* ============ CONNECT ============ */
function connectGmail(){
  if(!window.google){ alert("Google Login loading, try again."); return; }

  const client = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: SCOPES,
    prompt: "select_account",
    callback: async (resp) => {
      if(resp.error){ status("login failed: " + resp.error); return; }
      const token = resp.access_token;
      try{
        const profile = await api("https://gmail.googleapis.com/gmail/v1/users/me/profile", token);
        if(accounts.some(a => a.email === profile.emailAddress)){
          alert("This Gmail is already connected.");
          return;
        }
        accounts.push({ email: profile.emailAddress, token });
        renderAccounts();
        status(profile.emailAddress + " connected");
        loadAll();
      }catch(e){ status("error: " + e.message); }
    }
  });
  client.requestAccessToken();
}

async function api(url, token){
  const r = await fetch(url, { headers:{ Authorization: "Bearer " + token } });
  if(!r.ok){
    const e = await r.json().catch(()=>({}));
    throw new Error(e.error?.message || r.statusText);
  }
  return r.json();
}

/* ============ RENDER SIDEBAR ============ */
function renderAccounts(){
  const box = document.getElementById("accountsList");

  if(!accounts.length){
    box.innerHTML = '<div class="empty" style="padding:16px 12px;font-size:10px;text-align:left">no accounts yet</div>';
    return;
  }

  box.innerHTML = accounts.map((a, i) => `
    <div class="account-item ${currentView === i ? 'active' : ''}" onclick="selectAccount(${i})">
      <span class="acc-dot"></span>
      <span class="acc-email" title="${escapeHTML(a.email)}">${escapeHTML(a.email)}</span>
      <button class="acc-remove" onclick="event.stopPropagation(); removeAccount(${i})" title="Remove">×</button>
    </div>
  `).join("");

  // count for folder
  document.getElementById("count-all").textContent = mails.length;
}

/* ============ VIEWS ============ */
function selectAll(){
  currentView = "all";
  document.getElementById("folder-all").classList.add("active");
  document.querySelectorAll(".account-item").forEach(el => el.classList.remove("active"));
  renderMails();
}

function selectAccount(i){
  currentView = i;
  document.getElementById("folder-all").classList.remove("active");
  document.querySelectorAll(".account-item").forEach((el, idx) => {
    el.classList.toggle("active", idx === i);
  });
  renderMails();
}

function removeAccount(i){
  if(!confirm("Remove this Gmail from JONY MAIL?")) return;

  accounts.splice(i, 1);

  // Rebuild mails with corrected account indexes, dropping this account's mails
  mails = mails
    .filter(m => m.accountIndex !== i)
    .map(m => m.accountIndex > i ? { ...m, accountIndex: m.accountIndex - 1 } : m);

  if(currentView === i) currentView = "all";
  else if(typeof currentView === "number" && currentView > i) currentView--;

  renderAccounts();
  renderMails();
  status("account removed");
}

/* ============ LOAD MAIL ============ */
async function loadAll(){
  if(!accounts.length){ status("connect a gmail first"); return; }

  mails = [];
  status("loading messages...");
  document.getElementById("mailList").innerHTML = '<div class="empty">loading...</div>';

  for(let i = 0; i < accounts.length; i++){
    const acc = accounts[i];
    try{
      const res = await api(
        "https://gmail.googleapis.com/gmail/v1/users/me/messages?maxResults=40",
        acc.token
      );

      for(const item of (res.messages || [])){
        try{
          const msg = await api(
            "https://gmail.googleapis.com/gmail/v1/users/me/messages/" + item.id +
            "?format=metadata&metadataHeaders=From&metadataHeaders=Subject&metadataHeaders=Date",
            acc.token
          );
          const h = msg.payload?.headers || [];
          const get = n => h.find(x => x.name.toLowerCase() === n.toLowerCase())?.value || "";

          mails.push({
            id: item.id,
            accountIndex: i,
            email: acc.email,
            from: get("From"),
            subject: get("Subject") || "(no subject)",
            date: get("Date"),
            snippet: msg.snippet || ""
          });
        }catch(e){ console.log("msg err", e); }
      }
    }catch(e){
      status(acc.email + ": " + e.message);
    }
  }

  mails.sort((a, b) => new Date(b.date) - new Date(a.date));

  renderAccounts();
  renderMails();
  status("loaded " + mails.length + " messages from " + accounts.length + " account(s)");
}

/* ============ RENDER MAIL LIST ============ */
function renderMails(){
  const box = document.getElementById("mailList");
  const q = (document.getElementById("search").value || "").toLowerCase();

  // filter by current view + search
  const filtered = mails.filter(m => {
    const viewMatch = currentView === "all" || m.accountIndex === currentView;
    const searchMatch = q === "" ||
      (m.from + " " + m.subject + " " + m.snippet + " " + m.email).toLowerCase().includes(q);
    return viewMatch && searchMatch;
  });

  // update header
  const title = currentView === "all"
    ? "All Inbox"
    : (accounts[currentView]?.email || "Account");
  document.getElementById("viewTitle").innerHTML =
    escapeHTML(title) + ' <small>' + filtered.length + ' messages</small>';

  // update folder count
  document.getElementById("count-all").textContent = mails.length;

  if(!filtered.length){
    box.innerHTML = '<div class="empty">no messages</div>';
    return;
  }

  box.innerHTML = filtered.map(m => {
    const fromShort = m.from.replace(/<.*>/, "").trim() || m.from;
    return `
      <div class="mail" onclick="openMessage('${m.id}', ${m.accountIndex})">
        <div class="mail-from">${escapeHTML(fromShort)}</div>
        <div class="mail-subject">${escapeHTML(m.subject)}</div>
        <div class="mail-date">${escapeHTML(fmtDate(m.date))}</div>
        <div class="mail-snippet">
          <span class="mail-account-tag">${escapeHTML(m.email)}</span>
          &nbsp;${escapeHTML(m.snippet)}
        </div>
      </div>
    `;
  }).join("");
}

function fmtDate(d){
  if(!d) return "";
  try{
    const dt = new Date(d);
    const now = new Date();
    if(dt.toDateString() === now.toDateString()){
      return dt.toLocaleTimeString([], { hour:"2-digit", minute:"2-digit" });
    }
    return dt.toLocaleDateString([], { month:"short", day:"2-digit" });
  }catch{ return d; }
}

/* ============ READ MESSAGE ============ */
async function openMessage(id, accIndex){
  const acc = accounts[accIndex];
  if(!acc) return;

  status("opening...");
  try{
    const msg = await api(
      "https://gmail.googleapis.com/gmail/v1/users/me/messages/" + id + "?format=full",
      acc.token
    );

    const h = msg.payload?.headers || [];
    const get = n => h.find(x => x.name.toLowerCase() === n.toLowerCase())?.value || "";

    document.getElementById("readSubject").textContent = get("Subject") || "(no subject)";
    document.getElementById("readInfo").innerHTML =
      `<div><strong>FROM</strong>${escapeHTML(get("From"))}</div>` +
      `<div><strong>TO</strong>${escapeHTML(acc.email)}</div>` +
      `<div><strong>DATE</strong>${escapeHTML(get("Date"))}</div>`;
    document.getElementById("readBody").textContent =
      extractBody(msg.payload) || msg.snippet || "(empty message)";

    document.getElementById("listView").style.display = "none";
    document.getElementById("reader").classList.add("show");
    status("reading");
  }catch(e){
    status("could not open: " + e.message);
  }
}

function closeReader(){
  document.getElementById("reader").classList.remove("show");
  document.getElementById("listView").style.display = "flex";
}

function extractBody(part){
  if(!part) return "";
  if(part.body?.data){
    try{
      let d = part.body.data.replace(/-/g, "+").replace(/_/g, "/");
      d += "=".repeat((4 - d.length % 4) % 4);
      const b = Uint8Array.from(atob(d), c => c.charCodeAt(0));
      return new TextDecoder().decode(b);
    }catch{}
  }
  for(const p of (part.parts || [])){
    const b = extractBody(p);
    if(b) return b;
  }
  return "";
}

function escapeHTML(v){
  return String(v ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;",
    '"': "&quot;", "'": "&#39;"
  }[c]));
}
</script>

</body>
</html>
